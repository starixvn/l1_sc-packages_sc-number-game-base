variables:
    NODEJS_IMAGE: "$DOCKER_REG_LOCAL_URL/base/node:20.9.0-alpine"
    ENABLE_TEST_JS: "true"
    PUBLISH_NPM_IMAGE: "$DOCKER_REG_LOCAL_URL/base/node:20.9.0-alpine"

include:
    - project: "ci/core-cicd"
      ref: main
      file: "luminet.gitlab-ci.yml"

publish_npm:
    extends: .publish_npm
    needs: ["sonar_js"]
    before_script:
    - |
      apk update
      apk upgrade
      apk add git
    script:
        - npm install -g npm-cli-login
        - npm-cli-login -u $NPM_LUMI_USER_NAME -p $NPM_LUMI_USER_PASSWORD -e $NPM_LUMI_USER_EMAIL -r $NPM_LUMI_HOST
        - npm set registry $NPM_LUMI_HOST
        - yarn install
        - npm run reg
        - npm run build
        - npx semantic-release
    rules: !reference [.cd_rules, publish_npm]
